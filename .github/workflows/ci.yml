name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: CI only reads the repository. No secrets are needed.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        task: [lint, typecheck, test]
    steps:
      # Third-party actions are pinned to full commit SHAs (tag in the comment).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the pnpm version declared in package.json#packageManager.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # Node comes from .nvmrc; the pnpm store is cached by pnpm-lock.yaml hash.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check formatting
        if: matrix.task == 'lint'
        run: pnpm format:check

      - run: pnpm ${{ matrix.task }}

  # Database tests (pgTAP). Prepared here; it activates automatically once B01
  # adds supabase/config.toml. Until then every step after the probe is skipped.
  db:
    name: db (supabase test db)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect Supabase project
        id: probe
        run: |
          if [ -f supabase/config.toml ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::supabase/config.toml not found; skipping DB tests until B01 lands."
          fi

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        if: steps.probe.outputs.enabled == 'true'
        with:
          version: 2.121.0

      - name: Start local database
        if: steps.probe.outputs.enabled == 'true'
        run: supabase db start

      - name: Run pgTAP tests
        if: steps.probe.outputs.enabled == 'true'
        run: supabase test db
