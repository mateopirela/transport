name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: CI only reads the repository. No secrets are needed.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        task: [lint, typecheck, test]
    steps:
      # Third-party actions are pinned to full commit SHAs (tag in the comment).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the pnpm version declared in package.json#packageManager.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # Node comes from .nvmrc; the pnpm store is cached by pnpm-lock.yaml hash.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check formatting
        if: matrix.task == 'lint'
        run: pnpm format:check

      - run: pnpm ${{ matrix.task }}

  # Mobile app (B17): bundles the Expo app for iOS and Android so a broken
  # import, route or config plugin fails the PR, not the next native build.
  mobile:
    name: mobile (expo export)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Bundle the app (iOS and Android)
        run: pnpm --filter @transport/mobile export
        env:
          CI: 'true'
          EXPO_NO_TELEMETRY: '1'

  # Database: applies every migration to a fresh local Postgres, runs the pgTAP
  # suite and checks that the generated types (pnpm db:types) are up to date.
  # Mandatory since B01 added supabase/config.toml: there is no skip path.
  db:
    name: db (supabase test db)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.121.0

      - name: Start local database (applies migrations from scratch)
        run: supabase db start

      - name: Run pgTAP tests
        run: supabase test db

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check generated database types are up to date
        run: |
          pnpm db:types
          git diff --exit-code -- packages/shared/src/db.ts || {
            echo "::error::packages/shared/src/db.ts is stale. Run 'pnpm db:types' and commit the result."
            exit 1
          }
