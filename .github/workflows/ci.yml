name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: CI only reads the repository. No secrets are needed.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        task: [lint, typecheck, test]
    steps:
      # Third-party actions are pinned to full commit SHAs (tag in the comment).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the pnpm version declared in package.json#packageManager.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # Node comes from .nvmrc; the pnpm store is cached by pnpm-lock.yaml hash.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check formatting
        if: matrix.task == 'lint'
        run: pnpm format:check

      - run: pnpm ${{ matrix.task }}

  # Mobile app (B17): bundles the Expo app for iOS and Android so a broken
  # import, route or config plugin fails the PR, not the next native build.
  mobile:
    name: mobile (expo export)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Bundle the app (iOS and Android)
        run: pnpm --filter @transport/mobile export
        env:
          CI: 'true'
          EXPO_NO_TELEMETRY: '1'

  # Edge Functions (B08): type-checks every function with Deno and runs their
  # tests (simulated Supabase and Google Routes; no keys, no network).
  functions:
    name: functions (deno test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.7

      - name: Type-check and test the recommendations function
        run: |
          deno check --config supabase/functions/recommendations/deno.json supabase/functions/recommendations/index.ts
          deno test --config supabase/functions/recommendations/deno.json supabase/functions/recommendations/

      # B09: simulated Supabase, Expo Push and Resend (no keys, no network).
      - name: Type-check and test the dispatch-notifications function
        run: |
          deno check --config supabase/functions/dispatch-notifications/deno.json supabase/functions/dispatch-notifications/index.ts
          deno test --config supabase/functions/dispatch-notifications/deno.json supabase/functions/dispatch-notifications/

      # B25: request ids, structured logs and error reporting of every function.
      - name: Type-check and test the shared observability helpers
        run: |
          deno check --config supabase/functions/_shared/deno.json supabase/functions/_shared/
          deno test --config supabase/functions/_shared/deno.json supabase/functions/_shared/

  # End-to-end (B26): Playwright drives the web app against the local stack
  # (migrations + demo seed, Auth with Mailpit, Storage, Edge Functions). Only
  # the local anon key is used; no secrets. Maestro flows (mobile) are not run
  # here: they need a simulator (apps/mobile/.maestro/README.md).
  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.121.0

      - name: Start the local stack (migrations and the demo seed)
        run: supabase start --exclude studio,imgproxy,vector,logflare,supavisor,postgres-meta

      # Only the public URL and the anon key of the local stack (fixed dev values).
      - name: Export the local Supabase URL and anon key
        run: |
          supabase status -o env > "$RUNNER_TEMP/supabase.env"
          api_url=$(sed -n 's/^API_URL="\(.*\)"$/\1/p' "$RUNNER_TEMP/supabase.env")
          anon_key=$(sed -n 's/^ANON_KEY="\(.*\)"$/\1/p' "$RUNNER_TEMP/supabase.env")
          rm "$RUNNER_TEMP/supabase.env"
          test -n "$api_url" && test -n "$anon_key"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$api_url"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$anon_key"
          } >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install the Playwright browser
        run: pnpm --filter @transport/e2e e2e:install

      - name: Build the web app
        run: pnpm --filter @transport/web build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Run the Playwright suite
        run: pnpm --filter @transport/e2e e2e
        env:
          CI: 'true'
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  # Database: applies every migration and the demo seed to a fresh local
  # Postgres, checks the seed, runs the pgTAP suite on an empty database and
  # checks that the generated types (pnpm db:types) are up to date.
  # Mandatory since B01 added supabase/config.toml: there is no skip path.
  db:
    name: db (supabase test db)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.121.0

      - name: Start local database (applies migrations and the demo seed from scratch)
        run: supabase db start

      # B10: the demo seed (supabase/seed.sql) must load and stay consistent.
      - name: Check the demo seed
        run: supabase test db supabase/seed-tests

      # The pgTAP suite builds its own fixtures and expects an empty database.
      - name: Reset to an empty database for the pgTAP suite
        run: supabase db reset --no-seed

      - name: Run pgTAP tests
        run: supabase test db

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check generated database types are up to date
        run: |
          pnpm db:types
          git diff --exit-code -- packages/shared/src/db.ts || {
            echo "::error::packages/shared/src/db.ts is stale. Run 'pnpm db:types' and commit the result."
            exit 1
          }
