name: Mobile release

# B27: EAS Build of the mobile app and, optionally, submission to TestFlight
# and Google Play internal testing (profiles in apps/mobile/eas.json). Manual
# only. Builds run on EAS servers with the credentials stored there; the app's
# public variables come from the EAS environment of the profile, not from here.
# Skipped with a notice while EXPO_TOKEN is not configured. docs/release.md.

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        type: choice
        options: [production, preview]
        default: production
      platform:
        description: Platforms to build
        type: choice
        options: [all, ios, android]
        default: all
      submit:
        description: Submit to TestFlight / Play internal testing (production profile only)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: mobile-release
  cancel-in-progress: false

jobs:
  build:
    name: eas build (${{ inputs.profile }}, ${{ inputs.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Production builds use the production environment (reviewer), preview
    # builds the staging one. EXPO_TOKEN is a secret of each environment.
    environment: ${{ inputs.profile == 'production' && 'production' || 'staging' }}
    steps:
      - name: Only main or a v* tag can be built
        env:
          REF: ${{ github.ref }}
        run: |
          case "$REF" in
            refs/heads/main | refs/tags/v*) ;;
            *) echo "::error::Build from main or a v* tag, not $REF." && exit 1 ;;
          esac

      - name: Check that EAS is configured
        id: config
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PROFILE: ${{ inputs.profile }}
          PLATFORM: ${{ inputs.platform }}
          SUBMIT: ${{ inputs.submit }}
          ASC_APP_ID: ${{ vars.ASC_APP_ID }}
          EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::notice::EXPO_TOKEN is not configured: skipping the build (docs/release.md)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # EAS identifies the project from app.config.ts before it can fetch
          # the remote EAS environment, so the id must be known on the runner.
          if [ -z "$EAS_PROJECT_ID" ]; then
            echo "::error::Set the EAS_PROJECT_ID variable (public Expo project id) to build on EAS."
            exit 1
          fi
          if [ "$SUBMIT" = true ] && [ "$PROFILE" != production ]; then
            echo "::error::Only the production profile is submitted to the stores."
            exit 1
          fi
          if [ "$SUBMIT" = true ] && [ "$PLATFORM" != android ] && [ -z "$ASC_APP_ID" ]; then
            echo "::error::Set the ASC_APP_ID variable (App Store Connect app id) to submit to TestFlight."
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.config.outputs.enabled == 'true'
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.config.outputs.enabled == 'true'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.config.outputs.enabled == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # EAS evaluates app.config.ts locally, so the workspace must be installed.
      - name: Install dependencies
        if: steps.config.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile

      # The App Store Connect app id is public (not a secret) but only exists
      # once the app is created in App Store Connect, so it comes from a variable.
      - name: Set the App Store Connect app id
        if: steps.config.outputs.enabled == 'true' && vars.ASC_APP_ID != ''
        working-directory: apps/mobile
        env:
          ASC_APP_ID: ${{ vars.ASC_APP_ID }}
        run: |
          jq --arg id "$ASC_APP_ID" '.submit.production.ios.ascAppId = $id' eas.json > eas.tmp.json
          mv eas.tmp.json eas.json

      - name: Build (and submit) on EAS
        if: steps.config.outputs.enabled == 'true'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_NO_TELEMETRY: '1'
          # Public (not a secret): app.config.ts reads it for extra.eas.projectId.
          EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
          PROFILE: ${{ inputs.profile }}
          PLATFORM: ${{ inputs.platform }}
          SUBMIT: ${{ inputs.submit }}
        run: |
          args=(build --platform "$PLATFORM" --profile "$PROFILE" --non-interactive --no-wait)
          if [ "$SUBMIT" = true ]; then args+=(--auto-submit-with-profile production); fi
          npx --yes eas-cli@24.14.0 "${args[@]}"
