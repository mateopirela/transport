# Carrier (B19): signs in, sees the GDL -> MTY return trip of CS53-01 (which is
# unloading in Guadalajara) as a recommendation and offers the proposed price.
# Seed: jorge.villarreal@demo.test, load 02 of supabase/seed.sql.
appId: ${APP_ID}
name: Transportista · ofertar en el viaje de regreso
tags: [carrier, star]
---
- runFlow:
    file: subflows/sign-in.yaml
    env:
      EMAIL: jorge.villarreal@demo.test
- extendedWaitUntil:
    visible: 'Viajes de regreso'
    timeout: 30000
- assertVisible: 'CS53-01 · termina en Guadalajara'
- takeScreenshot: 01-1-carrier-home-return-trip
- tapOn: 'Guadalajara → Monterrey.*'
- extendedWaitUntil:
    visible: 'Detalle de la carga'
    timeout: 15000
- takeScreenshot: 01-2-carrier-load-detail
# The screen's primary action sits in the bottom bar, always in view (U4).
- extendedWaitUntil:
    visible: 'Aceptar el precio propuesto'
    timeout: 15000
- tapOn: 'Aceptar el precio propuesto'
# Confirmation sheet.
- tapOn: 'Confirmar'
- extendedWaitUntil:
    visible: 'Oferta enviada.'
    timeout: 15000
- assertVisible: 'Tu oferta está esperando la respuesta del cliente.'
- takeScreenshot: 01-3-carrier-offer-sent
