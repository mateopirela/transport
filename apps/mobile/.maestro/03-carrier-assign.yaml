# Carrier (B20): assigns unit and operator to the return trip it won, once
# CS53-01 and Pedro López are free (02 finished their unloading).
# Precondition: the shipper (luis.ramirez@demo.test) accepted the offer of
# 01-carrier-offer.yaml. `pnpm e2e:mobile` accepts it through the API (the
# same RPC as the web); by hand, on the web at
# /cliente/cargas/5eed0005-0000-4000-8000-000000000002 → "Negociar y chatear" → "Aceptar".
appId: ${APP_ID}
name: Transportista · asignar unidad y operador
tags: [carrier, star]
---
- runFlow:
    file: subflows/sign-in.yaml
    env:
      EMAIL: jorge.villarreal@demo.test
# Tab buttons read "<label>, tab, n of 5".
- extendedWaitUntil:
    visible: 'Viajes, tab.*'
    timeout: 30000
- tapOn: 'Viajes, tab.*'
- extendedWaitUntil:
    visible: 'Guadalajara → Monterrey.*'
    timeout: 15000
- takeScreenshot: 03-1-carrier-trips
- tapOn: 'Guadalajara → Monterrey.*'
- extendedWaitUntil:
    visible: 'Asignación'
    timeout: 15000
- scrollUntilVisible:
    element: 'CS53-01.*'
    centerElement: true
- tapOn: 'CS53-01.*'
- scrollUntilVisible:
    element: 'Pedro López.*'
    centerElement: true
- tapOn: 'Pedro López.*'
# The screen's primary action sits in the bottom bar, always in view (U4);
# then the confirmation sheet.
- tapOn: 'Asignar operador'
# The sheet slides up: tap its button once it settled.
- waitForAnimationToEnd
- tapOn: 'Sí, asignar'
- extendedWaitUntil:
    visible: 'Listo. Avisamos a .*'
    timeout: 15000
- takeScreenshot: 03-2-carrier-assigned
