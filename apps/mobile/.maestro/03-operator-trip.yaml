# Operator (B21-B23): accepts sharing the location, records the status steps
# of the pickup and takes the pickup photos before leaving with the load.
# Seed: miguel.hernandez@demo.test has the trip Apodaca -> GDL assigned.
# The photos need a camera: Android emulator (virtual scene) or a real phone;
# the iOS simulator has none, so run this flow on Android.
appId: ${APP_ID}
name: Operador · estados y evidencia
tags: [operator]
---
- runFlow:
    file: subflows/sign-in.yaml
    env:
      EMAIL: miguel.hernandez@demo.test
- extendedWaitUntil:
    visible: 'Avance del viaje'
    timeout: 30000
# The first time, the app asks for consent before tracking (B22).
- runFlow:
    when:
      visible: 'Revisar y aceptar'
    commands:
      - tapOn: 'Revisar y aceptar'
      - scrollUntilVisible:
          element: 'Acepto compartir mi ubicación'
      - tapOn: 'Acepto compartir mi ubicación'
- runFlow:
    file: subflows/status-step.yaml
    env:
      STEP: 'Salir a recolección'
- runFlow:
    file: subflows/status-step.yaml
    env:
      STEP: 'Llegué a recolección'
- runFlow:
    file: subflows/status-step.yaml
    env:
      STEP: 'Iniciar carga'
# Evidence (B23): the minimum pickup photos (2 by default), camera only.
- repeat:
    times: 2
    commands:
      - scrollUntilVisible:
          element: 'Tomar foto'
      - tapOn: 'Tomar foto'
      - runFlow: subflows/shutter.yaml
- extendedWaitUntil:
    visible: 'Subida'
    timeout: 30000
- runFlow:
    file: subflows/status-step.yaml
    env:
      STEP: 'Terminar carga y salir'
- scrollUntilVisible:
    element: 'Fin de carga'
