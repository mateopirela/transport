# Operator (F7): reports an incident and takes its photo WITHOUT a connection
# to the server; both stay on the phone, marked as pending.
# Continues 05 with the app still open (no sign-in). Precondition: the API is
# unreachable. `pnpm e2e:mobile` stops the local API gateway (the Kong
# container of Supabase) before this flow and starts it again after it. The
# iOS simulator shares the Mac's network and Maestro cannot turn it off there.
appId: ${APP_ID}
name: Operador · incidencia con foto sin conexión
tags: [operator, offline]
---
# "Reportar incidencia" is always in the "Tu siguiente paso" block (V7): it
# opens the report in a sheet.
- scrollUntilVisible:
    element: 'Reportar incidencia'
    direction: UP
# A tap while the scroll still glides only stops it: wait, and tap again
# until the sheet is up.
- retry:
    maxRetries: 2
    commands:
      - waitForAnimationToEnd
      - tapOn: 'Reportar incidencia'
      - extendedWaitUntil:
          visible: 'Enviar incidencia'
          timeout: 8000
- waitForAnimationToEnd
- tapOn: 'Retraso'
# Typed in place (subflows/fill-field.yaml scrolls, and a swipe would move
# the sheet): the input is right under its label.
- tapOn:
    below: 'Qué pasó'
- inputText: 'Tráfico detenido en la autopista por obras.'
# The sheet rests over the keyboard: its button is in reach.
- tapOn: 'Enviar incidencia'
# The sheet closes and the trip shows the incident in its list.
- scrollUntilVisible:
    element: 'Incidencia guardada en el teléfono.*'
    direction: DOWN
    timeout: 15000
# The incident is listed with its pending badge and already takes photos.
- assertVisible: 'Tráfico detenido en la autopista por obras.'
# The confirmation shows over the list, above the incident's button.
- runFlow:
    file: subflows/take-photo.yaml
    env:
      BUTTON: 'Agregar foto'
      NOTICE: UP
- scrollUntilVisible:
    element: '1 foto'
    direction: DOWN
    centerElement: true
- takeScreenshot: 06-1-operator-incident-offline
# Both wait on the phone: the report and its photo.
- scrollUntilVisible:
    element: 'Hay 1 registro guardado en el teléfono.*'
    direction: UP
    timeout: 30000
- assertVisible: '1 foto espera para subirse.*'
- takeScreenshot: 06-2-operator-pending-notices
