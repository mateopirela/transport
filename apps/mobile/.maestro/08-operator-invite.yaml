# Operator by phone (G2, D15-E1): opens the demo invitation link of
# Transportes Regios ("Regional Monterrey"), creates the account with a phone
# and a password (Edge Function redeem-invitation) and lands on step 4 of his
# profile (R3, D43): "Mis documentos". He takes his selfie (the stand-in
# camera of a development build, EXPO_PUBLIC_E2E_FAKE_CAMERA), sees what is
# missing in "En verificación" and goes on to his area, without a trip yet,
# where a notice says he cannot travel until his documents are approved.
# Seed: the operator link with the fixed local token demo-operador-trn-… (it
# is single-use: run `supabase db reset` before repeating the flow).
appId: ${APP_ID}
name: Operador · alta por enlace con teléfono
tags: [operator, invitation]
---
- clearKeychain
- launchApp:
    clearState: true
    permissions:
      location: always
      camera: allow
      notifications: deny
- openLink: ${DEV_CLIENT_URL}
# iOS can ask before a custom scheme opens the app ("Open in …?").
- extendedWaitUntil:
    visible: 'Open in .*'
    timeout: 3000
    optional: true
- tapOn:
    text: 'Open'
    optional: true
# The sign-in screen, or the invitation already (a link left pending by an
# interrupted run reopens on launch).
- extendedWaitUntil:
    visible: 'Entrar|Unirme con invitación'
    timeout: 60000
- runFlow:
    when:
      visible: 'Continue'
    commands:
      - tapOn: 'Continue'
      - waitForAnimationToEnd
# The dev menu sheet can stay open after "Continue": close it first.
- runFlow:
    when:
      visible: 'Toggle performance monitor'
    commands:
      - tapOn:
          point: '50%,12%'
      - waitForAnimationToEnd
- openLink: transport://invitacion/demo-operador-trn-0000000000000000000000000
# iOS can ask before a custom scheme opens the app ("Open in …?").
- extendedWaitUntil:
    visible: 'Open in .*'
    timeout: 3000
    optional: true
- tapOn:
    text: 'Open'
    optional: true
- extendedWaitUntil:
    visible: 'Transportes Regios del Norte.* te invita como Operador.*'
    timeout: 30000
- takeScreenshot: 08-1-operator-invite
- runFlow:
    file: subflows/fill-field.yaml
    env:
      LABEL: 'Nombre completo'
      TEXT: 'Mario Garza'
- runFlow: subflows/close-keyboard.yaml
- runFlow:
    file: subflows/fill-field.yaml
    env:
      LABEL: 'Teléfono'
      TEXT: '8110000099'
- runFlow: subflows/close-keyboard.yaml
- runFlow:
    file: subflows/fill-new-password.yaml
    env:
      LABEL: 'Contraseña'
      TEXT: 'Demo1234'
- runFlow: subflows/close-keyboard.yaml
- runFlow:
    file: subflows/fill-new-password.yaml
    env:
      LABEL: 'Confirma tu contraseña'
      TEXT: 'Demo1234'
# Each field is left with the keyboard put away (subflows/close-keyboard.yaml):
# on a 4.7-inch iPhone the next one would sit behind it (R6).
- runFlow: subflows/close-keyboard.yaml
# I1: the terms checkbox (20-terms-acceptance checks that it is required).
- scrollUntilVisible:
    element: 'Acepto los términos y condiciones y el aviso de privacidad'
    centerElement: true
- tapOn: 'Acepto los términos y condiciones y el aviso de privacidad'
# "Crear mi cuenta" stays in the bar at the bottom (R6).
- tapOn: 'Crear mi cuenta'
- extendedWaitUntil:
    visible: 'Not Now'
    timeout: 8000
    optional: true
- tapOn:
    text: 'Not Now'
    optional: true
- extendedWaitUntil:
    visible: 'Sube tu INE, tu licencia vigente y una selfie.*'
    timeout: 30000
- takeScreenshot: 08-2-operator-documents
- tapOn: 'Selfie.*'
# The sheet slides up: tap its first action once it has settled.
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: 'Tomar selfie'
    timeout: 10000
- tapOn: 'Tomar selfie'
- extendedWaitUntil:
    visible: 'Documento enviado. Lo revisaremos pronto.'
    timeout: 30000
- takeScreenshot: 08-3-selfie-sent
- tapOn: 'Siguiente'
- extendedWaitUntil:
    visible: 'Te falta subir o corregir 2 documentos obligatorios.'
    timeout: 15000
- takeScreenshot: 08-4-operator-verification
- tapOn: 'Ir al inicio'
- extendedWaitUntil:
    visible: 'No tienes un viaje asignado por ahora.*'
    timeout: 30000
- extendedWaitUntil:
    visible: 'Te faltan documentos para poder viajar.'
    timeout: 15000
- takeScreenshot: 08-5-operator-no-trip
