# Operator by phone (G2, D15-E1) and the precise location notice (D17, G9).
# Iván Garza has no email: he signs in with his phone (81 1000 0013) and
# Demo1234. Precondition (`pnpm e2e:mobile`, step trip-for-ivan): Héctor
# assigned him RF53-01 on Sofía's refrigerated Monterrey → Saltillo trip.
# The phone only gave the location "while using the app", so the trip shows
# "Ubicación precisa y Siempre" with "Abrir ajustes".
appId: ${APP_ID}
name: Operador por teléfono · ubicación precisa
tags: [operator, location]
---
- clearKeychain
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          clearState: true
          permissions:
            location: inuse
            camera: allow
            notifications: deny
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp:
          clearState: true
          permissions:
            location: allow
            camera: allow
            notifications: deny
- openLink: ${DEV_CLIENT_URL}
# iOS can ask before a custom scheme opens the app ("Open in …?").
- extendedWaitUntil:
    visible: 'Open in .*'
    timeout: 3000
    optional: true
- tapOn:
    text: 'Open'
    optional: true
- extendedWaitUntil:
    visible: 'Entrar'
    timeout: 60000
- runFlow:
    when:
      visible: 'Continue'
    commands:
      - tapOn: 'Continue'
      - waitForAnimationToEnd
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          file: subflows/fill-field.yaml
          env:
            LABEL: 'Correo o teléfono'
            TEXT: '8110000013'
      - assertVisible: '8110000013'
- runFlow:
    file: subflows/fill-field.yaml
    env:
      LABEL: 'Contraseña'
      TEXT: 'Demo1234'
- tapOn: 'Tu siguiente viaje, antes de terminar el actual.'
- tapOn: 'Entrar'
- extendedWaitUntil:
    visible: 'Not Now'
    timeout: 8000
    optional: true
- tapOn:
    text: 'Not Now'
    optional: true
- extendedWaitUntil:
    visible: 'Avance del viaje'
    timeout: 30000
- assertVisible: 'Destino: Saltillo, Coahuila'
- assertVisible: 'Ubicación precisa y "Siempre"'
- assertVisible: 'Activa la ubicación precisa y "Siempre" para que tu coordinador y el cliente vean tu avance.'
- assertVisible: 'Abrir ajustes'
- takeScreenshot: 12-1-operator-phone-precise-location
