# Carrier (H4, D31): the recommendation of the GDL -> MTY return trip of
# CS53-01 shows its estimated tolls (the CAPUFE tariffs of the pilot corridor:
# Los Chorros $306 + Lagos de Moreno $442 for a 5-axle truck; the other
# segments have no published tariff, hence "desde"), and the load detail shows
# the suggested road. Reads only: it runs first, on the fresh seed.
# Seed: jorge.villarreal@demo.test, load 02 of supabase/seed.sql; road catalog
# from supabase/migrations/20261101030100_road_pilot_corridor.sql.
appId: ${APP_ID}
name: Transportista · casetas y ruta sugerida
tags: [carrier, roads]
---
- runFlow:
    file: subflows/sign-in.yaml
    env:
      EMAIL: jorge.villarreal@demo.test
# The home opens as a dashboard (V8): the indicators and "Requiere tu
# atención" first, the recommendations further down.
- extendedWaitUntil:
    visible: 'Requiere tu atención'
    timeout: 30000
- scrollUntilVisible:
    element: 'Viajes de regreso'
    centerElement: true
    timeout: 30000
# Rows read as one accessibility element: match inside it.
- scrollUntilVisible:
    element: '.*Casetas desde \$748.*'
    centerElement: true
- takeScreenshot: 18-1-carrier-recommendation-tolls
# The recommendation under the unit (a trip on the road may share the route).
- tapOn:
    text: 'Guadalajara → Monterrey.*'
    below: 'CS53-01 · termina en Guadalajara'
- extendedWaitUntil:
    visible: 'Detalle de la carga'
    timeout: 15000
- scrollUntilVisible:
    element: 'Ruta sugerida'
    direction: DOWN
    timeout: 20000
- scrollUntilVisible:
    element: '.*MTY–GDL por Saltillo y San Luis Potosí.*'
    direction: DOWN
    timeout: 20000
- assertVisible: '.*desde \$748.00.*'
- takeScreenshot: 18-2-carrier-suggested-road
