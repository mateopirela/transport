# Accepted terms (I1, D35-E1): an operator creates their account from an
# invitation link, and the app does not let them without the terms checkbox.
# Once ticked, the account is created (the version of the terms is kept) and
# lands on the operator area without asking again.
# Before (`pnpm e2e:mobile`, step operator-link-for-terms): Jorge issued a
# fresh operator link of "Regional Monterrey"; its token is INVITE_TOKEN.
appId: ${APP_ID}
name: Operador · alta por enlace con términos
tags: [operator, invitation, terms]
---
- clearKeychain
- launchApp:
    clearState: true
    permissions:
      location: always
      camera: allow
      notifications: deny
- openLink: ${DEV_CLIENT_URL}
# iOS can ask before a custom scheme opens the app ("Open in …?").
- extendedWaitUntil:
    visible: 'Open in .*'
    timeout: 3000
    optional: true
- tapOn:
    text: 'Open'
    optional: true
- extendedWaitUntil:
    visible: 'Entrar|Unirme con invitación'
    timeout: 60000
- runFlow:
    when:
      visible: 'Continue'
    commands:
      - tapOn: 'Continue'
      - waitForAnimationToEnd
# The dev menu sheet can stay open after "Continue": close it first.
- runFlow:
    when:
      visible: 'Toggle performance monitor'
    commands:
      - tapOn:
          point: '50%,12%'
      - waitForAnimationToEnd
- openLink: transport://invitacion/${INVITE_TOKEN}
- extendedWaitUntil:
    visible: 'Open in .*'
    timeout: 3000
    optional: true
- tapOn:
    text: 'Open'
    optional: true
- extendedWaitUntil:
    visible: 'Transportes Regios del Norte.* te invita como Operador.*'
    timeout: 30000
- runFlow:
    file: subflows/fill-field.yaml
    env:
      LABEL: 'Nombre completo'
      TEXT: 'Lucía Torres'
- runFlow:
    file: subflows/fill-field.yaml
    env:
      LABEL: 'Teléfono'
      TEXT: '8110000098'
- runFlow:
    file: subflows/fill-new-password.yaml
    env:
      LABEL: 'Contraseña'
      TEXT: 'Demo1234'
- runFlow:
    file: subflows/fill-new-password.yaml
    env:
      LABEL: 'Confirma tu contraseña'
      TEXT: 'Demo1234'
- tapOn: 'Confirma tu contraseña'
# Without the checkbox the account is not created.
- scrollUntilVisible:
    element: 'Crear mi cuenta'
    centerElement: true
- tapOn: 'Crear mi cuenta'
- scrollUntilVisible:
    element: 'Acepta los términos y condiciones y el aviso de privacidad para continuar.'
    direction: UP
    centerElement: true
- takeScreenshot: 20-1-terms-required
- tapOn: 'Acepto los términos y condiciones y el aviso de privacidad'
- takeScreenshot: 20-2-terms-checked
- scrollUntilVisible:
    element: 'Crear mi cuenta'
    centerElement: true
- tapOn: 'Crear mi cuenta'
- extendedWaitUntil:
    visible: 'Not Now'
    timeout: 8000
    optional: true
- tapOn:
    text: 'Not Now'
    optional: true
# The terms were accepted at sign-up: straight to the operator area, on
# step 4 of his profile (R3, D43).
- extendedWaitUntil:
    visible: 'Sube tu INE, tu licencia vigente y una selfie.*'
    timeout: 30000
- assertNotVisible: 'Aceptar y continuar'
- takeScreenshot: 20-3-operator-in
