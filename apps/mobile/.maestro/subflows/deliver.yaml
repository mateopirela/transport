# Operator, unloading: takes the minimum delivery photos (2 by default),
# writes who receives and finishes the unloading (B23).
appId: ${APP_ID}
---
# The photos come before the estimate and receiver forms; each photo's
# confirmation shows under the camera button.
- scrollUntilVisible:
    element: 'Fotos de entrega'
    direction: UP
    centerElement: true
- repeat:
    times: 2
    commands:
      - runFlow:
          file: take-photo.yaml
          env:
            BUTTON: 'Tomar foto'
            NOTICE: DOWN
# A tap can land while the screen re-renders after the first photo: if
# only one counted, take the missing one. The count is the pill above the
# photos.
- scrollUntilVisible:
    element: '[0-9] de 2 fotos mínimas'
    direction: UP
    timeout: 30000
- runFlow:
    when:
      visible: '[01] de 2 fotos mínimas'
    commands:
      - runFlow:
          file: take-photo.yaml
          env:
            BUTTON: 'Tomar foto'
            NOTICE: DOWN
# (A photo of an interrupted run may still upload: 3 of 2 is fine too.)
- scrollUntilVisible:
    element: '[2-9] de 2 fotos mínimas'
    direction: UP
    timeout: 30000
- runFlow:
    file: fill-field.yaml
    env:
      LABEL: 'Nombre de quien recibe'
      TEXT: 'Laura Gómez Ruiz'
- tapOn: 'Quién recibe'
- runFlow:
    file: status-step.yaml
    env:
      STEP: 'Terminar descarga'
- scrollUntilVisible:
    element: 'Entregaste esta carga.*'
    direction: UP
    timeout: 30000
- assertVisible: 'Recibió: Laura Gómez Ruiz'
