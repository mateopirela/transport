# Like fill-new-password.yaml, for a new password in a form that also has a
# username (the sign-up, R2): iOS covers the keyboard with its own "Use Strong
# Password?" sheet, which is not in the app's hierarchy (Maestro cannot find
# it by text) and swallows what is typed. Its close button (top right of the
# sheet) brings the keyboard back; where it sits depends on the phone's size:
# SHEET_CLOSE (default the 6.9-inch iPhone's spot; '91%,54%' on the 4.7-inch
# iPhone SE, R6), which scripts/e2e-mobile.mjs passes on from its own
# environment. Needs LABEL and TEXT.
appId: ${APP_ID}
---
- scrollUntilVisible:
    element: ${LABEL}
    centerElement: true
- tapOn:
    below: ${LABEL}
- runFlow:
    when:
      platform: iOS
    commands:
      - waitForAnimationToEnd
      - tapOn:
          point: ${SHEET_CLOSE || '93%,61%'}
      - waitForAnimationToEnd
- eraseText: 60
- inputText: ${TEXT}
