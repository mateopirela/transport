# Like fill-new-password.yaml, for a new password in a form that also has a
# username (the sign-up, R2): iOS covers the keyboard with its own "Use Strong
# Password?" sheet, which is not in the app's hierarchy (Maestro cannot find
# it by text) and swallows what is typed. Its close button (top right of the
# sheet) brings the keyboard back. Needs LABEL and TEXT.
appId: ${APP_ID}
---
- scrollUntilVisible:
    element: ${LABEL}
    centerElement: true
- tapOn:
    below: ${LABEL}
- runFlow:
    when:
      platform: iOS
    commands:
      - waitForAnimationToEnd
      - tapOn:
          point: '93%,61%'
      - waitForAnimationToEnd
- eraseText: 60
- inputText: ${TEXT}
