# Like fill-field.yaml, for a new-password field (textContentType
# newPassword): iOS may offer a strong password when it gets the focus, and
# that sheet would swallow what is typed. Picks "Choose My Own Password".
appId: ${APP_ID}
---
- scrollUntilVisible:
    element: ${LABEL}
    centerElement: true
- tapOn:
    below: ${LABEL}
- extendedWaitUntil:
    visible: 'Choose My Own Password|Other Options.*'
    timeout: 3000
    optional: true
- tapOn:
    text: 'Choose My Own Password'
    optional: true
- eraseText: 60
- inputText: ${TEXT}
