# Taps one status button of the operator's trip and confirms it in its sheet.
# Needs STEP. The step is the primary of the "Tu siguiente paso" block, on
# top of the trip (V7): the flows close the keyboard of a field (the
# estimate, who receives) before they come here.
appId: ${APP_ID}
---
# Right after the previous step the screen can still re-render (the trip
# reloads and the block's button changes), so a tap may land while it is
# busy: tap again until the confirmation shows up.
- retry:
    maxRetries: 2
    commands:
      - waitForAnimationToEnd
      - scrollUntilVisible:
          element: ${STEP}
          direction: UP
          timeout: 15000
      - tapOn: ${STEP}
      - extendedWaitUntil:
          visible: 'Sí, confirmar'
          timeout: 8000
# The sheet slides up: tap its button once it settled.
- waitForAnimationToEnd
- tapOn: 'Sí, confirmar'
- extendedWaitUntil:
    notVisible: 'Sí, confirmar'
    timeout: 15000
