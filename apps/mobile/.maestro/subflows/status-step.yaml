# Taps one status button of the operator's trip and confirms it. Needs STEP.
appId: ${APP_ID}
---
# The step buttons follow "Avance del viaje": start there, wherever the
# screen was scrolled to.
- scrollUntilVisible:
    element: 'Avance del viaje'
    direction: UP
# Right after the previous step the screen can still re-render (the trip
# reloads and sections such as the delivery photos appear above the button),
# so a tap may land where the button was: tap again until the confirmation
# shows up.
- retry:
    maxRetries: 2
    commands:
      - waitForAnimationToEnd
      # A tap that landed on a form field (the estimate below "Iniciar
      # descarga") leaves the keyboard over the button: a tap on the section
      # title closes it.
      - scrollUntilVisible:
          element: 'Avance del viaje'
          direction: UP
      - tapOn: 'Avance del viaje'
      - scrollUntilVisible:
          element: ${STEP}
          centerElement: true
      - tapOn: ${STEP}
      - extendedWaitUntil:
          visible: 'Sí, confirmar'
          timeout: 8000
- tapOn: 'Sí, confirmar'
- extendedWaitUntil:
    notVisible: 'Sí, confirmar'
    timeout: 15000
