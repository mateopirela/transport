# Taps one status button of the operator's trip and confirms it in its sheet.
# Needs STEP. The step is the button of the bottom bar, always on screen.
appId: ${APP_ID}
---
- scrollUntilVisible:
    element: 'Avance del viaje'
    direction: UP
# Right after the previous step the screen can still re-render (the trip
# reloads and the bar's button changes), so a tap may land while it is busy:
# tap again until the confirmation shows up.
- retry:
    maxRetries: 2
    commands:
      - waitForAnimationToEnd
      # A field left focused (the estimate, who receives) keeps the keyboard
      # over the bar: a tap on the section title closes it.
      - scrollUntilVisible:
          element: 'Avance del viaje'
          direction: UP
      - tapOn: 'Avance del viaje'
      - extendedWaitUntil:
          visible: ${STEP}
          timeout: 15000
      - tapOn: ${STEP}
      - extendedWaitUntil:
          visible: 'Sí, confirmar'
          timeout: 8000
- tapOn: 'Sí, confirmar'
- extendedWaitUntil:
    notVisible: 'Sí, confirmar'
    timeout: 15000
