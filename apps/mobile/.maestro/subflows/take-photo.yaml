# Takes one evidence photo. Needs BUTTON ('Tomar foto' or 'Agregar foto') and
# NOTICE, where the confirmation shows up from the button: UP for the trip's
# photos (notice above the photos), DOWN for an incident's (below the list).
# The iOS simulator has no camera: its development build runs with
# EXPO_PUBLIC_E2E_FAKE_CAMERA=1, so the button returns a fixed photo at once.
# On Android the emulator's camera app takes it (shutter.yaml).
appId: ${APP_ID}
---
- scrollUntilVisible:
    element: ${BUTTON}
    centerElement: true
- tapOn: ${BUTTON}
- runFlow:
    when:
      platform: Android
    file: shutter.yaml
# `direction` is read before variables are resolved: one branch per value.
- runFlow:
    when:
      true: ${NOTICE === 'UP'}
    commands:
      - scrollUntilVisible:
          element: 'Foto guardada.*'
          direction: UP
          timeout: 15000
- runFlow:
    when:
      true: ${NOTICE === 'DOWN'}
    commands:
      - scrollUntilVisible:
          element: 'Foto guardada.*'
          direction: DOWN
          timeout: 15000
