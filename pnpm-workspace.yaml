packages:
  - apps/*
  - packages/*
  - e2e

# Single source of truth for versions shared by several workspaces.
catalog:
  typescript: 6.0.3
  vitest: 5.0.4

# Exceptions to pnpm's minimum release age: Next.js 16.4.1 and React 19.3.1
# ship critical security fixes (GHSA-673q-mjm6-r5xr, GHSA-2464-fhr4-w9xw,
# GHSA-p3m5-59mp-jv5r) and were published the day B11 was built. Remove once
# they are older than the minimum release age.
minimumReleaseAgeExclude:
  - '@next/env@16.4.1'
  - '@next/eslint-plugin-next@16.4.1'
  - '@next/swc-darwin-arm64@16.4.1'
  - '@next/swc-darwin-x64@16.4.1'
  - '@next/swc-linux-arm64-gnu@16.4.1'
  - '@next/swc-linux-arm64-musl@16.4.1'
  - '@next/swc-linux-x64-gnu@16.4.1'
  - '@next/swc-linux-x64-musl@16.4.1'
  - '@next/swc-win32-arm64-msvc@16.4.1'
  - '@next/swc-win32-x64-msvc@16.4.1'
  - next@16.4.1
  - react-dom@19.3.1
  - react@19.3.1

# Install scripts are denied unless listed. @sentry/cli (B25, via
# @sentry/react-native) gets its binary from a platform optional dependency;
# its postinstall download is not needed.
allowBuilds:
  '@sentry/cli': false

# B24: advisories reviewed in docs/seguridad.md ("Dependencias"). Both are in
# development tooling, never in what the apps ship, and have no patched
# release yet. CI (`pnpm audit --audit-level high`) fails on any other high or
# critical advisory. Review this list when a fix is published.
auditConfig:
  ignoreGhsas:
    # node-forge, through @expo/code-signing-certificates (Expo CLI).
    - GHSA-86w9-cpqp-85rv
    # braces, through @next/eslint-plugin-next (lint only).
    - GHSA-vfj7-8cjw-p6xm
