<!doctype html>
<html lang="es-MX">
  <body style="font-family: Arial, sans-serif; color: #131f33">
    <h2>Confirma tu correo</h2>
    <p>Gracias por registrarte. Para activar tu cuenta, escribe este código donde la creaste:</p>
    <p
      style="
        font-family: 'Courier New', monospace;
        font-size: 32px;
        font-weight: bold;
        letter-spacing: 6px;
        margin: 16px 0;
      "
    >
      {{ .Token }}
    </p>
    <p>O abre este enlace desde cualquier dispositivo:</p>
    <p>
      <a
        href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&redirect_to={{ .RedirectTo }}"
        style="
          background: #2f7bf0;
          color: #ffffff;
          padding: 12px 20px;
          border-radius: 6px;
          text-decoration: none;
        "
        >Confirmar correo</a
      >
    </p>
    <p>El código y el enlace vencen en una hora. Si no creaste esta cuenta, ignora este mensaje.</p>
  </body>
</html>
