<!doctype html>
<html lang="es-MX">
  <body style="font-family: Arial, sans-serif; color: #131f33">
    <h2>Confirma tu correo</h2>
    <p>Gracias por registrar tu empresa. Para activar tu cuenta, confirma tu correo:</p>
    <p>
      <a
        href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email"
        style="
          background: #2f7bf0;
          color: #ffffff;
          padding: 12px 20px;
          border-radius: 6px;
          text-decoration: none;
        "
        >Confirmar correo</a
      >
    </p>
    <p>Si no creaste esta cuenta, ignora este mensaje.</p>
  </body>
</html>
